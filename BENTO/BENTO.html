<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Caidic - Bento Layout</title>
</head>
<body>
<div class="container my-4 wide-container ">
    <h1 class="text-center mb-4 text-color"">"Going Home."</h1>
    <a href="https://musufflemuchii.github.io">Go back</a>
    
    <!--First Row-->
    <div class="row g-4">

        <!-- Large item -->
        <div class="col-md-4">
            <div class="bento-item bento-tall bg-primary">
                <img src="Image for Bento/LARGE IMAGE.jpg" alt="Large">
            </div>
        </div>

        <!-- Two items beside the Large item -->
        <div class="col-md-8">
            <div class="row g-4">

                <!--Smaller Item-->
                <div class="col-md-4">
                    <div class="bento-item bg-primary">
                        <img src="Image for Bento/Small Item.jpg" alt="Small Item">
                    </div>
                </div> 

                <!--Long Item-->
                <div class="col-md-8">
                    <div class="bento-item bg-primary">
                        <img src="Image for Bento/Medium" alt="Long Medium">
                    </div>
                </div>

                <!--Long Item, Below the Smaller and Long-->
                <div class="col-md-12">
                    <div class="bento-item bg-primary">
                        <img src="Image for Bento/Last Way Home.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>

        <!-- Medium item -->
        <div class="col-md-4">
            <div class="bento-item bg-primary">
                <img src="Image for Bento/Landscape Image 2.jpg" alt="">
            </div>
        </div>
        <!-- Medium item -->
        <div class="col-md-4">
            <div class="bento-item bg-primary">
                <img src="Image for Bento/Landscape Image 3.jpg" alt="">
            </div>
        </div>
        <!-- Medium item -->
        <div class="col-md-4">
            <div class="bento-item bg-primary">
                <img src="Image for Bento/Medium item 2.jpg" alt="">
            </div>
        </div>

        <!-- Testing-->
        <div class="col-md-12">
            <div class="bento-item bg-primary">
                <img src="Image for Bento/Landscape Image 1.jpg" alt="">
            </div>
        </div>


    </div>
</div>
</body>
</html>
